name: Build and Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked

      - name: Build optimized release
        run: cargo build --release --locked

      - name: Package release binary
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["name"])')"

          BIN_NAME="${PACKAGE_NAME//-/_}"
          BIN_PATH="target/release/${BIN_NAME}"

          if [ ! -f "$BIN_PATH" ]; then
            echo "Binary not found: $BIN_PATH"
            echo "If your binary has a custom name, update BIN_NAME."
            exit 1
          fi

          mkdir -p dist
          tar -czf "dist/${BIN_NAME}-linux-x86_64.tar.gz" \
            -C target/release "$BIN_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
